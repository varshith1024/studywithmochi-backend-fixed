spring.application.name=studywithmochi-backend

# Required (no defaults on purpose)
spring.datasource.url=${SDB_URL}
spring.datasource.username=${SDB_USERNAME}
spring.datasource.password=${SDB_PASSWORD}

# JWT secret must be at least 32 characters (256 bits) for HS256
jwt.secret=${JWT_SECRET}
# Milliseconds. The login cookie lifetime follows this value. Default: 1 hour
jwt.expiration=${JWT_EXPIRATION:3600000}

# Comma-separated list of frontend origins allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Cookie flags. Set COOKIE_SECURE=true in production (HTTPS only)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

spring.jpa.hibernate.ddl-auto=validate
